# The publix control plane: Traefik as the edge, publix beside it.
#
# Bring it up with:
#   docker compose -f deploy/docker-compose.yml up -d
#
# ── The one rule ──────────────────────────────────────────────────────────
# Every host path publix touches is mounted at the SAME path inside its
# container. publix hands paths to the Docker daemon, and the daemon
# resolves them on the host — so if /var/lib/publix meant something
# different inside than outside, publix would build from one directory
# while the daemon mounted another. Keep both sides identical when you
# change any of these.

name: publix

services:
  traefik:
    # 3.6 or newer, and not by taste: every Traefik up to 3.5 asks the
    # daemon for Docker API 1.24, and Docker Engine 29 raised its floor to
    # 1.40. On such a host the docker provider dies in a retry loop, Traefik
    # discovers no containers at all, and every project router in publix.yml
    # points at a service that never appears. DOCKER_API_VERSION does not
    # help — the provider pins its version in code and never negotiates.
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=publix
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only: Traefik only needs to discover containers, never to
      # create them.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/acme
    networks: [publix]

  publix:
    image: publix:local
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${PUBLIX_VERSION:-docker}
    restart: unless-stopped
    depends_on: [traefik]
    # The dashboard stays on loopback. publix drives the Docker socket,
    # which is equivalent to root on this host, so it should never be
    # directly reachable from the internet. Give it a domain through
    # Traefik instead (see docs/install.md).
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      # publix creates and destroys containers, so it needs write access.
      - /var/run/docker.sock:/var/run/docker.sock
      # Identical paths, per the rule above.
      - /var/lib/publix:/var/lib/publix
      - /etc/traefik/dynamic:/etc/traefik/dynamic
      # Volumes you register in the dashboard must be mounted here too, at
      # the same path. Do not add them to this file: it is replaced on
      # every upgrade. Copy docker-compose.override.yml.example to
      # docker-compose.override.yml and put them there instead.
    environment:
      PUBLIX_HOME: /var/lib/publix
      PUBLIX_ADDR: 0.0.0.0:4321
    networks: [publix]

networks:
  publix:
    name: publix
    external: true

volumes:
  traefik-acme:
